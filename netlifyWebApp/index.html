<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laundry WebApp</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #000000);
      --sec-bg: var(--tg-theme-secondary-bg-color, #f0f2f5);
      --btn-bg: var(--tg-theme-button-color, #3390ec);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
    }
    body {
      margin: 0; padding: 16px; font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text); box-sizing: border-box;
    }
    .card {
      background: var(--sec-bg); border-radius: 12px; padding: 14px; margin-bottom: 12px;
    }
    .slot {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px; background: var(--sec-bg); border-radius: 8px; margin: 8px 0; cursor: pointer;
    }
    .slot:hover { opacity: 0.85; }
    .status-bar { font-size: 0.9em; text-align: center; margin-bottom: 16px; }
    .ok { color: #2ecc71; } .err { color: #e74c3c; } .warn { color: #f39c12; }
    .btn {
      background: var(--btn-bg); color: var(--btn-text); border: none; padding: 12px;
      width: 100%; border-radius: 8px; font-weight: 500; cursor: pointer; margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="status-bar card" id="status">🔄 Инициализация...</div>
  
  <div class="card">
    <h3 style="margin-top:0">🕒 Доступные слоты</h3>
    <div id="slots">Загрузка...</div>
  </div>

  <script>
    // 1. Безопасное получение объекта Telegram
    const tg = window.Telegram?.WebApp;
    const statusEl = document.getElementById('status');
    const slotsEl = document.getElementById('slots');

    // 2. Настройки (поменяй API_URL на адрес своего Go-сервера)
    const API_URL = 'http://localhost:8080'; 

    // 3. Инициализация
    if (tg) {
      tg.ready();
      tg.expand();
      const user = tg.initDataUnsafe?.user;
      statusEl.innerHTML = `✅ Telegram WebApp активен | 👤 ${user?.first_name || 'Гость'} (ID: ${user?.id || '-'})`;
      statusEl.className = 'status-bar card ok';
    } else {
      statusEl.innerHTML = '⚠️ Открыто в браузере. Некоторые функции могут не работать.';
      statusEl.className = 'status-bar card warn';
    }

    // 4. Загрузка данных
    async function loadData() {
      try {
        // Пробуем запрос к твоему Go-серверу
        const res = await fetch(`${API_URL}/api/slots`, { method: 'GET' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        renderSlots(data);
      } catch (err) {
        // 🔧 ТЕСТОВЫЙ РЕЖИМ: если сервер недоступен, показываем мок-данные
        console.warn('Backend не ответил, включен тестовый режим:', err.message);
        statusEl.innerHTML += '<br><span class="warn">⚠️ Бэкенд не найден (показаны тестовые слоты)</span>';
        
        renderSlots([
          { id: 1, time: '10:00 - 12:00', status: 'Свободно' },
          { id: 2, time: '14:00 - 16:00', status: 'Занято' },
          { id: 3, time: '18:00 - 20:00', status: 'Свободно' }
        ]);
      }
    }

    // 5. Отрисовка
    function renderSlots(slots) {
      slotsEl.innerHTML = '';
      if (!slots?.length) {
        slotsEl.textContent = 'Нет доступных слотов';
        return;
      }
      slots.forEach(slot => {
        const el = document.createElement('div');
        el.className = 'slot';
        el.innerHTML = `<span>${slot.time}</span> <b>${slot.status}</b>`;
        el.onclick = () => tg?.showAlert(`Выбрано: ${slot.time}\n(Тут будет логика бронирования)`);
        slotsEl.appendChild(el);
      });
    }

    // Запуск
    loadData();
  </script>
</body>
</html>
