<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прачечная - Бронирование</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="app" class="app-container">
        <!-- Loading Screen -->
        <div id="loadingScreen" class="screen loading-screen active">
            <div class="loading-spinner">
                <div class="spinner"></div>
                <p>Загрузка...</p>
            </div>
        </div>

        <!-- Registration Screen -->
        <div id="registrationScreen" class="screen registration-screen">
            <div class="screen-content">
                <h1 class="screen-title">Добро пожаловать!</h1>
                <p class="screen-description">Пожалуйста, заполните данные для регистрации</p>
                
                <form id="registrationForm" class="registration-form">
                    <div class="form-group">
                        <label for="nameInput">Имя</label>
                        <input type="text" id="nameInput" placeholder="Введите имя" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="surnameInput">Фамилия</label>
                        <input type="text" id="surnameInput" placeholder="Введите фамилию" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="emailInput">Email</label>
                        <input type="email" id="emailInput" placeholder="Введите email" required>
                    </div>
                    
                    <button type="submit" class="button button-primary button-large">Зарегистрироваться</button>
                </form>
            </div>
        </div>

        <!-- Main Screen -->
        <div id="mainScreen" class="screen main-screen">
            <header class="header">
                <h1>Бронирование прачечной</h1>
                <div class="user-info">
                    <span id="userName" class="user-name">Пользователь</span>
                    <button id="profileBtn" class="button button-small button-secondary">Профиль</button>
                </div>
            </header>

            <main class="main-content">
                <!-- Tabs -->
                <div class="tabs">
                    <button class="tab-button tab-active" data-tab="available">
                        <span class="tab-icon">📅</span>
                        Доступные слоты
                    </button>
                    <button class="tab-button" data-tab="booked">
                        <span class="tab-icon">✓</span>
                        Мои бронирования
                    </button>
                </div>

                <!-- Available Slots Tab -->
                <div id="availableTab" class="tab-content tab-active">
                    <div class="filter-controls">
                        <div class="filter-group">
                            <label for="machineTypeFilter">Тип машины:</label>
                            <select id="machineTypeFilter" class="select-control">
                                <option value="">Все машины</option>
                                <option value="washing">Стиральная машина</option>
                                <option value="dryer">Сушилка</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label for="dateFilter">Дата:</label>
                            <input type="date" id="dateFilter" class="select-control">
                        </div>
                    </div>

                    <div id="availableSlotsList" class="slots-list">
                        <div class="loading-message">
                            <div class="mini-spinner"></div>
                            Загрузка слотов...
                        </div>
                    </div>
                </div>

                <!-- Booked Slots Tab -->
                <div id="bookedTab" class="tab-content">
                    <div id="bookedSlotsList" class="slots-list">
                        <div class="empty-message">
                            <p>📭 У вас нет активных бронирований</p>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <!-- Profile Modal -->
        <div id="profileModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Профиль</h2>
                    <button class="modal-close" aria-label="Закрыть">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="profile-info">
                        <div class="info-row">
                            <span class="info-label">Имя:</span>
                            <span id="profileName" class="info-value">-</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Фамилия:</span>
                            <span id="profileSurname" class="info-value">-</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Email:</span>
                            <span id="profileEmail" class="info-value">-</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Error Toast -->
        <div id="errorToast" class="toast toast-error">
            <span id="errorToastMessage">Произошла ошибка</span>
            <button class="toast-close">&times;</button>
        </div>

        <!-- Success Toast -->
        <div id="successToast" class="toast toast-success">
            <span id="successToastMessage">Успешно выполнено</span>
            <button class="toast-close">&times;</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
